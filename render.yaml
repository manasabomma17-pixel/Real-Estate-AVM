# Render blueprint for the FastAPI backend.
# In Render: New > Blueprint > pick this repo, and it reads this file.
services:
  - type: web
    name: real-estate-avm-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # signs the login tokens; Render makes a long random value once
      - key: AUTH_SECRET
        generateValue: true
      # where user accounts are saved: paste the Neon Postgres connection
      # string in the Render dashboard (it is a secret, so not in git)
      - key: DATABASE_URL
        sync: false
      # "Forgot password" emails go through Brevo's web API (Render's free
      # plan blocks normal email ports). Set both in the Render dashboard.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
